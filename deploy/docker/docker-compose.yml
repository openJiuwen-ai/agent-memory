# agent-memory 完整后端栈：Redis 真源 + Elasticsearch 关键词 + Milvus 向量
# （etcd + MinIO + standalone）+ 云端 LLM + 进程内 bge 嵌入/精排。
#
#   cp .env.example .env   # 填入 LLM_API_KEY
#   docker compose up -d --build
name: agent-memory

services:
  # ---------------- 真源：Redis ----------------
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------- 关键词召回：Elasticsearch ----------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf 'http://localhost:9200/_cluster/health?wait_for_status=yellow' >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ---------------- 向量召回：Milvus = etcd + MinIO + standalone ----------------
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command:
      - etcd
      - -advertise-client-urls=http://127.0.0.1:2379
      - -listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    volumes:
      - etcd-data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - minio-data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.4.13
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      - "19530:19530"   # gRPC / SDK
      - "9091:9091"     # metrics / healthz
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  # ---------------- 应用：agent-memory HTTP 服务 ----------------
  agent-memory:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    env_file:
      - .env
    volumes:
      - ./config.yml:/config/config.yml:ro
      - ./models:/models-local:ro   # 预下载的本地模型（ModelScope，离线加载）：.env 默认指向这里
      - hf-models:/models        # HF 缓存卷：仅当把 EMBED_MODEL 改回 HF repo id 时的回退路径
      - ../../src:/app/src:ro    # 挂载源码：改 src 免重镜像（镜像用 editable 安装指向 /app/src）
      - ../../bootstrap:/app/bootstrap:ro   # 挂载 HTTP 服务面：改 handler/server 免重镜像
    ports:
      - "8137:8137"
    depends_on:
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      milvus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8137/healthz').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

volumes:
  redis-data:
  es-data:
  etcd-data:
  minio-data:
  milvus-data:
  hf-models:
