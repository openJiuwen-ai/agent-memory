# agent-memory 部署配置（docker compose）
#
# 选型：LLM 云端（OpenAI 兼容）+ 本地 bge 嵌入/精排（进程内）+ Milvus 向量召回 +
# Elasticsearch 关键词召回 + Redis 真源。召回走「向量 + 关键词」双路，关闭图。
#
# 配置模型为**两级命名空间**（见 jiuwen_memory/config）：顶层 = 各组件（Producer 的 TOP_NAME），
# 其下 = 具名实例（target/params）。用户配置会**合并覆盖**到内置默认（纯内存离线栈）之上，
# 故此处只写要改动的部分：globals 跨切面参数 + 把各 default 实例换成真后端实现。其余拓扑
# （recaller / constructor / evolver / scheduler 等）沿用默认并经具名引用自动指向这些真后端。
#
# 连接串与密钥经环境变量注入（${VAR} / ${VAR:-默认值}，由 __main__.py 展开），配置文件
# 本身不落密；可改的项见同目录 .env.example。换实现/换后端只动本文件。
#
# 注意：profile 供服务面（profiles 层）使用；memory_api 段的值即交给内核装配的两级命名空间。
profile: docker

memory_api:
  # ---- 跨切面参数（写一处，各组件经 globals 读到；具名实例 params 可覆盖）----
  globals:
    vector_enabled: true        # 向量索引 + 向量召回路（Milvus）
    graph_enabled: false        # 不启用图召回路
    rerank_enabled: true        # 披露前精排（本地 bge reranker）
    entity_enabled: false       # 实体关联链路总开关：写入侧 HybridIndexBuilder 建实体反向索引、
                                # 召回侧 KeywordRecaller 经 manager 的 ENTITY 端口做 L2 实体扩展。
                                # 设 true 生效；false 时两侧消费方均跳过（端口仍会被 manager
                                # 装配并参与 health；若要连装配一起免掉，删下方 entity_store 段）。
                                # 当前默认关——全链路生效还依赖 unit.entities 明文填充
                                #（写入侧 LLM 抽取前移）。

    # bge-m3 dense 维度 = 1024，必须与 Milvus collection 的 dim 一致
    embedder_dim: 1024
    chunk_size: 512

    # —— LLM：阿里云 DashScope OpenAI 兼容端点——
    llm_model: "${LLM_MODEL:-qwen-plus}"
    llm_base_url: "${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}"
    llm_api_key: "${LLM_API_KEY}"
    llm_temperature: 0.0

    # —— 本地 bge-m3 嵌入（进程内）——
    # 模型须提前通过 ModelScope 下载至 ./models（见 README 的「预下载模型」），并经
    # compose 挂载到容器 /models-local。此处为目录路径 → 直接从磁盘加载，不联网。
    embedder_bge_m3_model: "${EMBED_MODEL:-/models-local/bge-m3}"
    embedder_bge_m3_fp16: true

    # —— 本地 bge reranker（进程内；同样从 /models-local 离线加载）——
    reranker_bge_model: "${RERANK_MODEL:-/models-local/bge-reranker-v2-m3}"
    reranker_bge_fp16: true

    # —— 运行时可变策略（交 PolicyManager；值保持字符串）——
    policies:
      rerank.enabled: "true"

  # ---- 共享插件：覆盖各命名空间下的 default 实例（参数缺省读 globals）----
  llm:
    default:
      target: dashscope
      params:
        enable_thinking: "${LLM_ENABLE_THINKING:-false}"
  embedder:
    default: { target: bge_m3 }
  reranker:
    default: { target: bge_reranker }
  tokenizer:
    default: { target: jieba }

  # ---- 存储后端：覆盖各命名空间下的 default 实例（必填连接参数缺失会在装配期直接报错）----
  kv_store:                      # 真源
    default:
      target: redis
      params:
        url: "${REDIS_URL:-redis://redis:6379/0}"
  fulltext_store:               # 关键词召回（BM25）
    default:
      target: elasticsearch
      params:
        hosts: "${ES_HOSTS:-http://elasticsearch:9200}"
  vector_store:                 # 向量召回（ANN）
    default:
      target: milvus
      params:
        uri: "${MILVUS_URI:-http://milvus:19530}"
        collection: "${MILVUS_COLLECTION:-agent_memory_vectors}"
        dim: 1024
        metric_type: COSINE

  # ---- 实体反向索引（ES；StoreManager 的 ENTITY 端口 = StorageCapability 第七席）----
  # entity_store 是 manager 的 ENTITY 端口（F07-D 起纳入 capability，不再旁路装配）。
  # 端口解析三级：store_manager params 显式引用 → 本 entity_store.default 具名实例 →
  # 无 ENTITY 能力。故这里声明 default 即自动成为 manager 的 ENTITY 默认端口，无需
  # （也不建议）为此新增 store_manager 段——实例级覆盖会整体替换 defaults.py 的
  # store_manager.default.params（含全部 *_recaller 键），漏抄即静默丢一路召回。
  # hosts 未配时 ES builder 返 None → 无 ENTITY 能力 → 读写两侧自动降级关闭（不报错）。
  # 声明并构造成功后本端口参与 manager.health() 聚合：ES entity 不可达会让 health 报错
  # （写入/召回主链路不受影响，两侧各有 try/except 兜底）。
  # entity_text 明文不落 ES（只存 sha256 hash），与 fulltext_store 可共用同一 ES 集群但落独立 index。
  entity_store:
    default:
      target: elasticsearch
      params:
        hosts: "${ES_HOSTS:-http://elasticsearch:9200}"
        index: "${ES_ENTITY_INDEX:-memory_entities}"
        # entity 索引用 space_id 作 ES routing（强制 _routing.required），不走 fulltext 的
        # analyzer（hash 精确匹配，不分析词条形态）。SSL 同 fulltext_store 风格。
        ssl_verify: "${ES_SSL_VERIFY:-false}"
        ssl_ca_cert: "${ES_SSL_CA:-}"

  # constructor（index_builder）：实例级覆盖会整体替换默认 params，故 chunker/embedder
  # 须写全，否则丢失。
  constructor:
    default:
      target: hybrid
      params:
        chunker: default
        embedder: default
        # ENTITY 端口选择键：值是 manager 的端口名（不是 Producer 引用），params 直读
        # 不回退 globals，缺省即 "default"。entity 链路是否启用另由 globals.entity_enabled
        # 决定；读写两侧取的是同一 manager 的同一端口，实例共享由 manager 保证。
        entity_store: default

  # recaller.keyword 具名实例：实例级覆盖整体替换默认 recaller.keyword params。
  recaller:
    keyword:
      target: keyword
      params:
        entity_store: default      # 同上：ENTITY 端口选择键（召回侧 L2 实体扩展）
    # keyword_l0/keyword_l1/vector* 沿用 defaults.py 默认（不在此重复声明，避免整体替换丢字段）

  # query_parser 不走 LLM 改写：对话模型会把 query「答」成长文，反而拖垮召回（语义漂移 +
  # 10~19s 延迟）。通过 rewrite_enabled 开关控制改写（默认关闭）；如需启用，设为 true 并
  # 配置适合改写的 LLM。实例级覆盖会整体替换默认 params，故 tokenizer/embedder 需一并写出。
  query_parser:
    default:
      target: simple
      params:
        tokenizer: default
        embedder: default
        llm: { target: echo }
        rewrite_enabled: false
