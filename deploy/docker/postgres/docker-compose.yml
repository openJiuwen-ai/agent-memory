# agent-memory backend stack using PostgreSQL/pgvector and remote model APIs.
#
# Use with:
#   cp .env.example .env
#   docker compose up -d --build
name: agent-memory-postgres

services:
  postgres:
    image: pgvector/pgvector:0.8.3-pg16
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-agent_memory}"
      POSTGRES_USER: "${POSTGRES_USER:-agent_memory}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-agent_memory}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../../scripts/pg_schema.sql:/docker-entrypoint-initdb.d/10-agent-memory.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sf 'http://localhost:9200/_cluster/health?wait_for_status=yellow' >/dev/null || exit 1
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  agent-memory:
    build:
      context: ../../..
      dockerfile: deploy/docker/postgres/Dockerfile
    env_file:
      - .env
    volumes:
      - ./config.yml:/config/config.yml:ro
      - ../../../jiuwen_memory:/app/jiuwen_memory:ro
      - ../../../jiuwen_memory_entry:/app/jiuwen_memory_entry:ro
    ports:
      - "8137:8137"
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen('http://localhost:8137/healthz').status==200 else 1)
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

volumes:
  postgres-data:
  es-data:
