[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "JiuwenMemory"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42",
    "numpy>=1.24",
    "openai>=1.0",
    "jieba>=0.42",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# httpx / python-dotenv / requests 是被测代码的真实依赖，缺失时对应用例只会跳过或直接
# 无法收集，CI 会绿在没有覆盖的地方；故一并纳入 dev。
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.8",
    "httpx>=0.27,<1",
    "python-dotenv>=1.0",
    "requests>=2.31",
]
nlp = [
    "spacy>=3.7",
    "hanlp>=2.1",
]
embed = [
    "FlagEmbedding>=1.2",
    "torch>=2.0",
    # transformers 5.x 移除了 FlagReranker 仍调用的 prepare_for_model，会令 bge reranker 崩；固定在 4.x。
    "transformers>=4.39,<5",
]
multimodal = [
    "dashscope>=1.24.0",
    # video_asr 的 DashScope ASR 通路直接用 requests 发起上传与轮询。
    "requests>=2.31",
]
# APIReranker 与 jiuwenswarm HTTP 客户端所需的 HTTP 客户端库。
rerank = [
    "httpx>=0.27,<1",
]
# 接真后端部署所需的客户端库（Milvus / Elasticsearch / Redis / PostgreSQL）+ YAML 配置解析。
deploy = [
    "pymilvus>=2.4",
    "elasticsearch>=8,<9",
    "redis>=5",
    "asyncpg>=0.30",
    "pyyaml>=6",
    "httpx>=0.27,<1",
]
# MCP surface（jiuwen_memory_entry/mcp_server）：把记忆动词暴露为 Model Context Protocol 工具。
mcp = [
    "mcp>=1.2",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.8",
    "httpx>=0.27,<1",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.setuptools.packages.find]
where = ["."]
include = [
    "jiuwen_memory*",
    "jiuwen_memory_adapter*",
    "jiuwen_memory_entry*",
]
exclude = [
    "jiuwen_memory_entry.cli*",
    "jiuwen_memory_entry.mcp_server*",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "unit: fast unit and contract tests",
    "integration: multi-component integration tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# UP006/UP035/UP045 固化 AGENTS.md 的类型标注规约（PEP 585/604：list[X]、dict[K,V]、
# X | None）。只选这三条而非整个 UP：UP 全量还会带来 str-enum、datetime.UTC 等 200+ 条
# 与本规约无关的改动，属于独立的风格决策。
select = ["E", "F", "W", "I", "UP006", "UP035", "UP045"]
