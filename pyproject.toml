[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "JiuwenMemory"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42",
    "numpy>=1.24",
    "openai>=1.0",
    "jieba>=0.42",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.8",
]
nlp = [
    "spacy>=3.7",
    "hanlp>=2.1",
]
embed = [
    "FlagEmbedding>=1.2",
    "torch>=2.0",
    # transformers 5.x 移除了 FlagReranker 仍调用的 prepare_for_model，会令 bge reranker 崩；固定在 4.x。
    "transformers>=4.39,<5",
]
multimodal = [
    "dashscope>=1.24.0",
]
# 接真后端部署所需的客户端库（Milvus / Elasticsearch / Redis / PostgreSQL）+ YAML 配置解析。
deploy = [
    "pymilvus>=2.4",
    "elasticsearch>=8,<9",
    "redis>=5",
    "asyncpg>=0.30",
    "pyyaml>=6",
]
# MCP surface（jiuwen_memory_entry/mcp_server）：把记忆动词暴露为 Model Context Protocol 工具。
mcp = [
    # v1.27.2 修复 Streamable HTTP session 未绑定认证主体的高危漏洞；当前适配器使用
    # v1 FastMCP API，显式挡住不兼容的 v2 大版本升级。
    "mcp>=1.27.2,<2",
    "pyyaml>=6",
]
# 认证能力（jiuwen_memory/common/security/authentication/key_store）：API Key 的 Argon2id 哈希。标准库无 Argon2id；缺依赖时在
# 装配期抛 ValidationError，绝不降级为明文比对。
# 静态加密所需的 cryptography 已在主依赖里（common.encryption 用）。
security = [
    "argon2-cffi>=23.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.8",
]

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.setuptools.packages.find]
where = ["."]
include = [
    "jiuwen_memory*",
    "jiuwen_memory_adapter*",
    "jiuwen_memory_entry*",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "unit: fast unit and contract tests",
    "integration: multi-component integration tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
