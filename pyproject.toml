[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "JiuwenMemory"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42",
    "numpy>=1.24",
    "openai>=1.0",
    "jieba>=0.42",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.8",
]
nlp = [
    "spacy>=3.7",
    "hanlp>=2.1",
]
embed = [
    "FlagEmbedding>=1.2",
    "torch>=2.0",
    # transformers 5.x 移除了 FlagReranker 仍调用的 prepare_for_model，会令 bge reranker 崩；固定在 4.x。
    "transformers>=4.39,<5",
]
multimodal = [
    "dashscope>=1.24.0",
]
# 接真后端部署所需的客户端库（Milvus / Elasticsearch / Redis / PostgreSQL / WatchDog）
# + 文档模式向量召回所需的 sqlite-vec + YAML 配置解析。
deploy = [
    "pymilvus>=2.4",
    "elasticsearch>=8,<9",
    "redis>=5",
    "asyncpg>=0.30",
    "pyyaml>=6",
    "watchdog>=4.0",
    # 文档记忆（F07/F08）影子索引的 vec0 向量表扩展。代码用 try/except ImportError 软依赖——
    # 不装则降级为「全量+倒排」两表，向量召回缺一路但不抛错（倒排召回照常）。
    # 装上 + 配 embedder 才进入完整模式（建 memory_vec 表，向量召回可用）。
    "sqlite-vec>=0.1",
]
# MCP surface（jiuwen_memory_entry/mcp_server）：把记忆动词暴露为 Model Context Protocol 工具。
mcp = [
    "mcp>=1.2",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.8",
]

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.setuptools.packages.find]
where = ["."]
include = [
    "jiuwen_memory*",
    "jiuwen_memory_adapter*",
    "jiuwen_memory_entry*",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "unit: fast unit and contract tests",
    "integration: multi-component integration tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
