# 只改这个文件即可切换 benchmark、题目范围和并行参数。
benchmark: longmemeval

longmemeval:
  data: datasets/longmemeval/longmemeval_mini.json
  memory_config: longmemeval/config.yml
  output_root: outputs/longmemeval
  # question_ids 非空时优先按题号选择；否则使用 sample_indices。
  question_ids: []
  sample_indices: [0]
  max_questions: 1
  concurrency: 1
  # 运行时自动追加唯一 run_id；复用 Redis/ES/Milvus 也不会读取旧评测数据。
  scope_org: longmemeval-0804-local-smoke
  # 默认保留本轮后端数据用于 bad case/evidence 溯源；改为 true 才在成功测评后清理。
  cleanup_after_run: false
  granularity: dialogue_turn
  dialogue_turn_max_chars: 4096
  oracle_sessions: true
  infer: true
  recall_top_k: 200
  answer_cutoff: 50
  answer_cutoffs: [50, 10, 20]
  judge_strict: false
  proxy_retry_attempts: 4

locomo:
  data: datasets/locomo/locomo_mini.json
  memory_config: locomo/config.yml
  output_root: outputs/locomo
  conversation_ids: [0]
  max_sessions: 0
  max_turns: 5
  max_qa: 2
  concurrency: 1
  recall_top_k: 200
  cutoffs: [10, 20, 50, 200]
  # 仅作产物标签；正常写入时程序会追加唯一 run_id 生成独立 Scope。
  run_tag: local-smoke
  # 仅在复用旧数据做检索对比时填写此前 run_meta.json 中的 SCOPE_TAG。
  scope_tag: ""
  skip_write: false
  # 默认保留本轮后端数据用于 bad case/evidence 溯源。
  cleanup_after_run: false
