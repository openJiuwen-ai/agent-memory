# 与部署的认证配置一起加载。这里只声明可信连接，不创建身份或授予空间权限。
globals:
  # 仅共享 SDK 接续使用；HTTP 服务沿用其入口预算。
  # sdk_max_workers: 16     # 同时执行的读写调用数（正整数）
  # sdk_max_queue_size: 256 # 等待槽位数（非负整数，0 表示不预留等待容量）
  continuity_connectors:
    workbuddy:
      actor: {org: demo, space: '', user: wb, agent: '', session: ''}
      projects: [role-project]
      enabled: true
    hermes:
      actor: {org: demo, space: '', user: hermes, agent: '', session: ''}
      projects: [role-project]
      enabled: true
    jiuwenswarm:
      actor: {org: demo, space: '', user: swarm, agent: '', session: ''}
      projects: [role-project]
      enabled: true
engine:
  default:
    target: cloud
    params:
      ingestor: default
      index_builder: default
      retriever: default
      kv_store: default
      scheduler: default
      evolver: default
      lifecycle: default
authorizer:
  default:
    target: space_aware
    params: {delegate: standard}
  standard:
    target: standard
    params: {grant_store: default, delegation_store: default}
permission:
  default:
    target: space_aware
    params: {db_path: role-permissions.db}
kv_store:
  default:
    target: sqlite
    params: {db_path: role-memory.db, fixed_path: true}
  registry:
    target: sqlite
    params: {db_path: role-registry.db, fixed_path: true}
  evidence:
    target: sqlite
    params: {db_path: role-graph.db, fixed_path: true}
graph_store:
  evidence:
    target: kv
    params: {kv_store: evidence}
constructor:
  evidence:
    target: evidence_graph
    params: {graph_store: evidence}
role_view:
  default: {target: bounded}
# 接续模式（不需要图存储）的最小配置：删去上方 graph_store / constructor / role_view 及
# 下方图与关系相关键，并把 mode 改为 continuity；保留的图相关键会被忽略并在启动日志告警。
#   continuity:
#     default:
#       target: local
#       params: {mode: continuity, single_writer: true, registry_store: registry}
continuity:
  default:
    target: local
    params:
      mode: role            # 必填：role（角色模式，需图存储与 role_view）或 continuity
      single_writer: true
      registry_store: registry
      # 任务描述查询默认使用 embedder.default；设 embedder: null 则使用 BM25。
      # tokenizer: default  # BM25 使用同一分词器处理查询和任务标题/说明。
      graph_store: evidence
      relation_index_builder: evidence
      role_view: default
      relation_types_path: examples/role_memory/relation_types.yaml
      duty_policies_path: examples/role_memory/duty_policies.yaml
      # 可选：配置一个真实具名 LLM，再设置 relation_associator: evidence。
      # 不启用时仍支持明确引用、手工关系登记/复核和职责展开。
# associator:
#   evidence:
#     target: evidence_llm
#     params: {llm: your_configured_llm}
