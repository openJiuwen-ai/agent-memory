# 完整 API Key + 隐私保护 + Passkey 配置；Root 只用于受信管理初始化。
# 启动前设置密钥、邀请摘要和独立的 JIUWEN_PRIVACY_STATE_DIR；持久库需复用原密钥。
memory_api:
  globals: {privacy_enabled: true, vector_enabled: false}
  security:
    default:
      target: standard
      params:
        authenticator: issuer
        authorizer: default
        rate_limiter: ingress
        workload_guard: auth_budget
        binding_policy: default
  authenticator:
    issuer:
      target: api_key
      params:
        key_store: principals
        root_api_key: ${AGENT_MEMORY_ROOT_API_KEY}
  key_store:
    principals: {target: memory}
  binding_policy:
    default: {target: loopback}
  authorizer:
    default:
      target: standard
      params: {grant_store: default, delegation_store: default}
  grant_store:
    default: {target: memory}
  delegation_store:
    default: {target: memory}
  constructor:
    default: {target: hybrid}
  privacy:
    default:
      target: regex
      params:
        privacy_store: private
        staging_ttl: 300
        staging_limit: 10000
        regex_timeout: 2.0
        llm_enabled: false
  privacy_store:
    private:
      target: encrypted
      params:
        cryptography: privacy
        raw_privacy_store:
          target: kv
          params:
            max_state_bytes: 67108864
            kv_store:
              target: sqlite
              params:
                db_path: '${JIUWEN_PRIVACY_STATE_DIR}/fragments.sqlite'
  cryptography:
    privacy: {target: local, params: {key_provider: privacy}}
  key_provider:
    privacy:
      target: local
      params: {key_env: JIUWEN_PRIVACY_MASTER_KEY, key_file: ''}
  human_authenticator:
    default:
      target: passkey
      params:
        rp_id: localhost
        origin: http://localhost:8137
        credential_path: '${JIUWEN_PRIVACY_STATE_DIR}/passkeys.sqlite'
        challenge_ttl: 120
        enrollment_invites:
          - digest: '${JIUWEN_PRIVACY_ALICE_INVITE_SHA256}'
            actor: {org: demo, user: alice}
          - digest: '${JIUWEN_PRIVACY_BOB_INVITE_SHA256}'
            actor: {org: demo, user: bob}
  rate_limiter:
    ingress: {target: token_bucket, params: {capacity: 30, refill_per_sec: 5}}
    human: {target: token_bucket, params: {capacity: 10, refill_per_sec: 1}}
  workload_guard:
    auth_budget: {target: semaphore, params: {max_concurrent: 4}}
    human: {target: semaphore, params: {max_concurrent: 4}}
