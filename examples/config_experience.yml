# agent-memory 经验记忆（mem2.0）装配配置示例
#
# 覆盖完整经验链路：轨迹写入 → 评价（成败判定/归因）→ 提炼落盘 → 检索复用
# → 周期整理（Curator）→ 技能归纳（SkillAbstractor）。使用方式同
# config_template.yml：合并覆盖到内置默认之上，只写要改动的部分。
#
# 最小可跑形态（进程内栈 + 真实 LLM）即本文件取消注释的部分；换持久后端
# （milvus/es/redis）参照 config_template.yml 的对应段覆盖 kv_store /
# vector_store / fulltext_store 即可，经验链路不感知后端。
#
# 经验特性见 docs/features/construction/F10-experience-memory-and-skill.md
# 与 docs/features/retrieval/F09-experience-retrieval.md。

# ---- 真实模型（经验链路的判定/归因/提炼都要真实 LLM；不配则 echo 桩，仅供联调）----
llm:
  default:
    target: openai                # 或 dashscope
    params:
      llm_api_key: "sk-..."       # 生产经 ${VAR} 环境变量注入，勿提交进仓库
      llm_model: gpt-4o
      llm_base_url: https://api.example.com/v1
      llm_temperature: 0.0
      llm_max_tokens: 4096

# ---- 经验部署配置（§2）：落点、周期整理空间、技能沉淀开关 ----
globals:
  experience:
    # 带 coords 的写入经验标为该类别、按其空间模板落点；指向对话记忆已在用
    # 的类别即与对话同空间。不带 coords 时走 default_space。
    memory_class: project
    # 缺省 own = 写入者自己的空间（私有经验）；或填空间名（共享经验空间）。
    default_space: shared-experience
    # 周期整理空间清单：只在这些空间跑周期整理；skill: true 同时开启技能沉淀
    # （技能归纳以经验沉淀开启为前提）。repro_unit 缺省 auto（写入者空间按
    # 轨迹计数、其余按用户计数）。
    curated_spaces:
      - { space: shared-experience, skill: true }

# ---- 引擎与调度（周期任务须 async_timer；进程内缺省调度器不支持周期任务）----
scheduler:
  default: { target: async_timer }

# ---- 同一引擎：检索按流程名选择，后台整理按 mode 选择完整处理实例 ----
engine:
  default:
    target: cloud                  # 支持共享空间；样例的存储后端仍为进程内实现
    params:
      ingestor: default
      index_builder: default
      retriever: default
      scheduler: default
      evolver: default
      lifecycle: default
      job_factory: default
      pipeline: default
      message_type_key: memory_type
      # 调用方经 Context.extensions.retrieval_pipeline 选择名称；类型范围自动绑定。
      # 名字由开发者配置，普通与经验可以复用同一检索实现、装配不同算子。
      retrieval_pipelines:
        default:
          retriever: default
          exclude_memory_types: [experience, skill]
        experience:
          retriever: experience
          memory_types: [experience]
      # 后台任务直接按 mode 选择此处理实例，不逐条按 profile 分组。
      mode_evolvers:
        experience_consolidate: experience

# ---- evolver 双 profile：对话沿用 default，经验写入走 experience ----
evolver:
  # 对话记忆：内置默认 orchestrating（dynamic_llm 抽取，无评价算子），不用写。
  # 经验写入配置评价与抽取；后台 experience_consolidate mode 复用此实例中的
  # curator/abstractor，执行一次“经验整理 → 技能归纳 → 落盘”。
  experience:
    target: dynamic
    params:
      index_builder: default      # 与引擎/profile 复用 constructor.default，避免匿名新建
      extractor: experience       # ExperienceExtractor：提炼环境事实/条件动作
      appraiser: experience        # ExperienceAppraiser：判定成败、归因、记复现
      curator: experience          # ExperienceCurator：专用 mode 内先整理
      abstractor: skill            # SkillAbstractor：技能归纳（整理之后）
      llm: default                 # 必须显式引用——dep 缺省会匿名新建 echo 桩
      # 去重结论按抽取策略限定（F09：四种结论里的「更新」会改写已有条目并丢
      # 元数据，经验不接受；条件动作执行动作不同的并存——不含取代）。
      dedup_decisions:
        experience_fact: [add, noop, supersede]
        experience_tip: [add, noop]
      dedup: experience            # 经验的去重实例（见下：打开 tier 过滤）

# ---- 经验去重实例：vector 召回 + 按 tier 过滤（经验不与对话互判重复）----
dedup:
  experience:
    target: vector
    params:
      embedder: default
      tier_filter: true

# ---- 技能归纳算子（F11：evolver.experience 的 abstractor 引用它）----
abstractor:
  skill:
    target: skill
    params:
      llm: default                 # 逐组一次模型调用（生成 SKILL.md 草稿）
      embedder: default             # 分组相似度连边用

# ---- 经验算子参数 ----
extractor:
  experience:
    target: experience
    params:
      llm: default

appraiser:
  experience:
    target: experience
    params:
      # 作者摘要的 HMAC salt：部署后固定不换（换了历史效用事件键对不上）。
      # 生产经 ${VAR} 注入；未配置时经验 profile 装配失败（显式报错）。
      author_key: "change-me-in-production"
      llm: default
      # 外部结果阈值按生产者配置（缺省 0.999——高于它才算 external 级成功）：
      external_thresholds:
        "user:alice": 0.8

curator:
  experience:
    target: experience
    params:
      llm: default                 # 第 4 步合并删除用（可选：缺省只做规则退休）
      embedder: default             # 聚簇相似度用（可选，同上）
      # message_store 若显式声明，必须指向 kv_store.default 同一实例——
      # 按作者清除的标记与算子读的 KV 不同源时合规清除会静默失效，
      # 装配期校验会拒绝。缺省不写即同源。

# ---- 检索双 profile：对话无 Selector，经验走选取（复现要求/排序分/探索名额）----
retriever:
  # 对话检索：内置默认（pipeline，无 selector），不用写。
  experience:
    target: pipeline
    params:
      query_parser: default       # 与普通流程共用具名 QueryParser / Embedder
      selector_enabled: true       # ExperienceSelector：经验条目选取过滤

# ---- 流水线双 profile 绑定：memory_type 路由（experience 不回落，§2.3）----
pipeline:
  default:
    target: metadata
    params:
      profiles:
        default:
          index_builder: default
          retriever: default
          evolver: default
        experience:
          index_builder: default
          retriever: experience     # 经验条目经经验 retriever（带选取）
          evolver: experience
      fallback: default             # 未知 memory_type 回落对话 profile

# ---- 空间治理（共享经验空间需要：创建空间、成员鉴权）----
permission:
  default:
    target: space_aware
    params: { db_path: ":memory:" }   # 生产换 sqlite 文件路径或 pg

authorizer:
  default:
    target: space_aware
    params: { delegate: standard }
  standard:
    target: standard
    params: { grant_store: default, delegation_store: default }

grant_store:
  default: memory                     # 生产换持久后端
delegation_store:
  default: memory

# 调用示意（需先创建空间并授权；这里不自动注册后台任务）：
# api.search(..., context=Context(scope=..., extensions={"retrieval_pipeline": "experience"}), ...)
# api.evolve(..., mode=EvolveMode.EXPERIENCE_CONSOLIDATE, dreaming=True,
#            interval=7 * 24 * 60 * 60, security=...)
# 新 mode 会自动以 memory_type=experience 过滤候选；整理失败本轮不生成技能。
