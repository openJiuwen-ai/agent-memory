# E2E 测试 Profile：SQLite 文件库 + Mock 内核 + 全量迁移
# 用于 agent-memory-platform-dev 项目的端到端测试
spring:
  datasource:
    url: jdbc:sqlite:./data/platform-e2e-dev.db
    driver-class-name: org.sqlite.JDBC
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations:
        - classpath:db/migration/V1__ops_center_init_sqlite.sql
        - classpath:db/migration/V2__governance_init_sqlite.sql
        - classpath:db/migration/V3__config_center_init_sqlite.sql
        - classpath:db/migration/V4__log_center_init_sqlite.sql
        - classpath:db/migration/V5__task_registry_init_sqlite.sql
        - classpath:db/migration/V6__tenant_user_init_sqlite.sql
        - classpath:db/migration/V7__scope_registry_init_sqlite.sql
        - classpath:db/migration/V9__auth_kernel_restart_perm_sqlite.sql
        - classpath:db/migration/V10__log_collect_records_sqlite.sql
        - classpath:db/migration/V11__readonly_log_read_perm_sqlite.sql

platform:
  memory-service:
    mode: mock
    base-url: http://127.0.0.1:8516
    api-key: test-key
  feature:
    default-scope: __default__
  confirm-token:
    ttl: 5m

server:
  port: 0  # 随机端口

logging:
  level:
    com.openjiuwen.memory: WARN
    org.springframework.security: WARN
