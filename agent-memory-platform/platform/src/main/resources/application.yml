# 平台后端公共配置（与具体数据库无关）
# 切换数据库：把 spring.profiles.active 改为 sqlite / mysql 即可
spring:
  application:
    name: platform
  profiles:
    active: sqlite                  # 使用 GaussDB 数据库

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true               # 列 snake_case ↔ 字段 camelCase 自动映射
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto                                  # 未显式标注的主键用自增

server:
  port: 9000
  servlet:
    context-path: /
  # 差异#1 Fix: Layer 1 — Tomcat AccessLogValve（设计文档 §6.3.3 双层架构）
  # 零代码开发，覆盖全量 HTTP 请求，记录请求行+状态码+耗时，不入库
  tomcat:
    accesslog:
      enabled: true
      directory: ${LOG_DIR:./logs}
      prefix: localhost_access
      suffix: .log
      pattern: '%h %l %u %t "%r" %s %b %D'
      rotate: true
      max-days: 7

platform:
  memory-service:
    base-url:         # 本地内核（jiuwen_memory memory_server，端口 8000）
    api-key:                              # 留空：服务层与内核属同一信任域，无需鉴权（内核原 auth_middleware 机制保留）
    connect-timeout: 10s
    read-timeout: 120s            # 热重建 /admin/restart 重建 stores 耗时 >30s，放宽到 2 分钟；普通调用秒级完成不受影响
  feature:
    default-scope: __default__
  confirm-token:
    ttl: 5m
  # CORS 跨域策略——前端 (Vue :5173) 与后端 (:9000) 分属不同端口。
  # 生产环境应将 allowed-origins 收窄为实际前端域名。
  cors:
    allowed-origins: "*"
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600
  # Spring Security 公开端点——这些路径跳过 JWT 认证。
  # 新增公开端点时在此追加，逗号分隔，无需改代码。
  security:
    public-paths: /api/v1/auth/login,/api/v1/auth/register,/api/v1/auth/info,/api/v1/auth/logout

logging:
  level:
    com.openjiuwen.memory: INFO
  # 服务层应用日志落盘（运行日志"服务层"来源，§6.3.2 扩展）：
  # 与 Tomcat access log 同目录 ${LOG_DIR:./logs}，按天轮转 + 按大小切分。
  # 文件名固定 platform.log，轮转文件 platform.YYYY-MM-DD.i.log，供 /logs/runtime?source=platform 读取。
  file:
    name: ${LOG_DIR:./logs}/platform.log
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_DIR:./logs}/platform.%d{yyyy-MM-dd}.%i.log
      max-file-size: 50MB
      max-history: 14
      total-size-cap: 1GB
