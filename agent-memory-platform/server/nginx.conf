# 前端生产 nginx 配置：
#   - 托管 Vite 构建产物
#   - SPA history 模式回退到 index.html
#   - /api/ 反代到 docker 网络内的 platform:9000（与 vite dev proxy 一致）

server {
    listen       80;
    server_name  _;
    charset      utf-8;

    root   /usr/share/nginx/html;
    index  index.html;

    # gzip 压缩静态资源
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # 静态资源缓存（Vite 构建产物文件名带 hash，可长缓存）
    location ~* \.(?:js|css|woff2?|ttf|png|jpg|jpeg|gif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # 后端 API：/api/* 反代到 platform 容器的 9000 端口
    location /api/ {
        proxy_pass         http://platform:9000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SPA history 模式：所有未匹配路由回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
